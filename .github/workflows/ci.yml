name: CI

# The tooling is verified with its own targets, as every Borba repository is.
# The reusable workflows in this directory are exercised by the repositories
# that call them, at the commit they pin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PRIMARY_JAVA: "21"
  CLOJURE_CLI_VERSION: "1.12.5.1664"
  BABASHKA_VERSION: "1.13.225"

jobs:
  check:
    name: Tests, lint and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.PRIMARY_JAVA }}

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clojure-${{ runner.os }}-

      - name: Run the tests
        run: make test

      - name: Lint
        run: make lint

      - name: Check the formatting
        run: make fmt-check

      - name: Check the conventions
        run: make conventions

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        run: make workflows

  security:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history for committed secrets
        run: make secret-scan

  gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [check, workflows, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${RESULTS}"
          jq -e 'all(.[]; .result == "success")' <<<"${RESULTS}" >/dev/null
