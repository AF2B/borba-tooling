name: Clojure library scheduled checks

# What changes without a commit: a dependency gets a newer version, a
# vulnerability is published, a secret scanner learns a new pattern. The
# caller runs this on a schedule. See docs/standard.md.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PRIMARY_JAVA: "21"
  CLOJURE_CLI_VERSION: "1.12.5.1664"
  BABASHKA_VERSION: "1.13.225"

jobs:
  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Outdated dependencies
      ISSUE_LABEL: dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.PRIMARY_JAVA }}

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clojure-${{ runner.os }}-

      # One open issue lists what is outdated and is closed when nothing is.
      - name: Report outdated dependencies in an issue
        run: |
          mkdir -p target
          status=0
          make outdated > target/outdated.txt || status=$?
          existing="$(gh issue list --state open --label "${ISSUE_LABEL}" \
            --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [[ "${status}" -eq 0 ]]; then
            if [[ -n "${existing}" ]]; then
              gh issue close "${existing}" --comment "Every dependency is current again."
            fi
            exit 0
          fi
          {
            echo "These dependencies have a newer version. Update them in a pull request."
            echo
            echo '```text'
            cat target/outdated.txt
            echo '```'
          } > target/issue-body.md
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file target/issue-body.md
          else
            gh label create "${ISSUE_LABEL}" --force >/dev/null
            gh issue create --title "${ISSUE_TITLE}" --label "${ISSUE_LABEL}" \
              --body-file target/issue-body.md
          fi

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.PRIMARY_JAVA }}

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clojure-${{ runner.os }}-

      - name: Scan the resolved dependencies for known vulnerabilities
        run: make audit

      - name: Scan the history for committed secrets
        run: make secret-scan
