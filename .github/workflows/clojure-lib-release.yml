name: Clojure library release

# Publishes the release of a version tag: checks the tag and its changelog,
# builds the jar and the bill of materials, attests where they were built and
# creates the GitHub release. The quality gate runs first, in the caller. A
# library is consumed from git (tag and commit), so the jar is a convenience
# and the attestation says where it came from. See docs/standard.md.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PRIMARY_JAVA: "21"
  CLOJURE_CLI_VERSION: "1.12.5.1664"
  BABASHKA_VERSION: "1.13.225"

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is cut from the default branch, never from a stray tag.
      - name: Check that the tag is on the default branch
        run: |
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.PRIMARY_JAVA }}

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: ${{ env.CLOJURE_CLI_VERSION }}
          bb: ${{ env.BABASHKA_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clojure-${{ runner.os }}-

      - name: Check that the tag can be released
        run: make release-check TAG="${TAG}"

      - name: Build the jar and the bill of materials
        run: |
          export APP_VERSION="${TAG#v}"
          make build sbom

      - name: Write the release notes
        run: |
          bb -x borba.tooling.release/notes --tag "${TAG}"
          {
            echo
            echo "### Use it from deps.edn"
            echo
            echo '```clojure'
            echo "io.github.af2b/${REPOSITORY#*/} {:git/url \"https://github.com/${REPOSITORY}\""
            echo "                                 :git/tag \"${TAG}\""
            echo "                                 :git/sha \"${GITHUB_SHA}\"}"
            echo '```'
          } >> target/release-notes.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/*.jar
            target/sbom.cdx.json

      - name: Create the release
        run: |
          gh release create "${TAG}" target/*.jar target/sbom.cdx.json \
            --verify-tag \
            --title "${TAG}" \
            --notes-file target/release-notes.md
